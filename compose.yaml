services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      INCIDENT_DB: /app/data/incidents.db
    volumes:
      - incidents-data:/app/data
    init: true
    restart: unless-stopped

  tests:
    build: .
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    profiles: ["test"]

volumes:
  incidents-data:

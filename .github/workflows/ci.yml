name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q backend tests
      - name: Run API checks
        run: python -m unittest discover -s tests -v
      - name: Check dependency inventory
        run: python -m pip install --disable-pip-version-check pip-audit && pip-audit -r requirements.txt
      - name: Package application
        run: python -m zipfile -c incident-hub-${GITHUB_SHA::7}.zip backend frontend database README.md requirements.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: incident-hub-${{ github.sha }}
          path: incident-hub-${{ github.sha }}.zip
          if-no-files-found: error



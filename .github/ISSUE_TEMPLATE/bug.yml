name: Reporte de defecto
description: Registrar un defecto reproducible
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado y pasos para reproducir
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options: [Crítica, Alta, Media, Baja]
    validations:
      required: true

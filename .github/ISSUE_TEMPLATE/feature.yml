name: Historia de usuario
description: Solicitar una capacidad del IT Incident Hub
title: "[Historia] "
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Historia
      description: Como [rol], quiero [capacidad] para [beneficio].
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: "- Dado... cuando... entonces..."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options: [P1, P2, P3]
    validations:
      required: true

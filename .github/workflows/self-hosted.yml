name: Self-hosted runner demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Verify Windows runner
    runs-on: [self-hosted, Windows, X64, incident-hub]
    steps:
      - name: Report runner environment
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          python --version
          git --version
